name: fanzoom-backend-rehearsal

services:
  pocketbase:
    build:
      context: .
      dockerfile: docker/pocketbase.Dockerfile
      args:
        PB_VERSION: "0.40.0"
    entrypoint: ["/rehearsal/pocketbase-rehearsal-entrypoint.sh"]
    environment:
      PB_SUPERUSER_EMAIL: ${PB_REHEARSAL_SUPERUSER_EMAIL}
      PB_SUPERUSER_PASSWORD: ${PB_REHEARSAL_SUPERUSER_PASSWORD}
      PB_REHEARSAL_MODE: ${PB_REHEARSAL_MODE:-legacy}
      VIEW_RATE_LIMIT_SECRET: ${PB_REHEARSAL_VIEW_SECRET:-}
      SHARED_RATE_LIMIT_HOOK_SECRET: ${PB_REHEARSAL_HOOK_SECRET:-}
      SHARED_RATE_LIMIT_HOOK_SECRET_PREVIOUS: ${PB_REHEARSAL_HOOK_SECRET_PREVIOUS:-}
    ports:
      - "127.0.0.1:${PB_REHEARSAL_PORT:-18090}:8090"
    volumes:
      - fanzoom_backend_rehearsal_data:/pb/pb_data
      - ./pb_migrations:/pb/pb_migrations:ro
      - ./pb_hooks:/pb/pb_hooks:ro
      - ./docker/pocketbase-rehearsal-entrypoint.sh:/rehearsal/pocketbase-rehearsal-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s
    restart: unless-stopped

volumes:
  fanzoom_backend_rehearsal_data:
